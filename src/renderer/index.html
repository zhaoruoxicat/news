<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'none'"
    />
    <title>热点聚合查看器</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <!-- 自定义标题栏 -->
      <header class="titlebar">
        <div class="tb-brand">
          <svg class="tb-logo" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12 2c.6 3.4-1.4 5-3 6.6C7.3 10.2 6 11.8 6 14.4 6 18 8.9 21 12.5 21S19 18 19 14.4c0-2.3-1-4-2.3-5.6-.5 1.4-1.6 2.3-2.7 2.6.9-2.6.6-6.3-2-9.4Z"
            />
          </svg>
          <h1>热点聚合查看器</h1>
          <span class="tb-sub">本机网络直连 · 多平台热榜汇总</span>
        </div>
        <div class="tb-actions">
          <button class="win-btn" id="btn-min" title="最小化" aria-label="最小化">
            <svg viewBox="0 0 12 12"><path d="M2 6h8" /></svg>
          </button>
          <button class="win-btn" id="btn-max" title="最大化" aria-label="最大化">
            <svg viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" rx="1" /></svg>
          </button>
          <button class="win-btn danger" id="btn-close" title="关闭" aria-label="关闭">
            <svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6" /></svg>
          </button>
        </div>
      </header>

      <div class="body">
        <!-- 侧边平台导航 -->
        <aside class="sidebar">
          <div class="side-title">
            <span>平台总览</span>
            <span class="side-total" id="side-total">—</span>
          </div>
          <nav class="side-list" id="side-list" role="tablist"></nav>
          <div class="side-foot">
            <button class="ghost-btn" id="btn-refresh-all">全部重新抓取</button>
            <p class="side-hint">数据来自各平台公开热榜接口，仅供个人查看</p>
          </div>
        </aside>

        <!-- 主区域 -->
        <main class="main">
          <div class="toolbar">
            <div class="search">
              <svg class="search-icon" viewBox="0 0 16 16" aria-hidden="true">
                <circle cx="7" cy="7" r="4.5" />
                <path d="M10.5 10.5L14 14" />
              </svg>
              <input
                id="search"
                type="search"
                placeholder="搜索全部平台的热点标题…"
                autocomplete="off"
                spellcheck="false"
              />
              <button class="search-clear" id="search-clear" title="清空" aria-label="清空">
                <svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6" /></svg>
              </button>
            </div>

            <div class="tool-actions">
              <label class="switch" title="每 5 分钟自动刷新一次">
                <input type="checkbox" id="auto-refresh" />
                <span class="track"><span class="knob"></span></span>
                <span class="switch-label">自动刷新</span>
              </label>
              <button class="primary-btn" id="btn-refresh">
                <svg class="spin-icon" viewBox="0 0 16 16" aria-hidden="true">
                  <path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9" />
                  <path d="M13.6 2.2v3.1h-3.1" />
                </svg>
                <span id="refresh-text">刷新</span>
              </button>
            </div>
          </div>

          <div class="view-head" id="view-head" hidden></div>
          <div class="content" id="content"></div>
        </main>
      </div>

      <footer class="statusbar">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">正在准备…</span>
        <span class="status-spacer"></span>
        <span id="status-meta"></span>
      </footer>
    </div>

    <div class="toast" id="toast" hidden></div>

    <script src="app.js"></script>
  </body>
</html>
